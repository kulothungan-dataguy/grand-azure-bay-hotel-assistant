services:
  - type: web
    name: grand-azure-bay-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m app.rag.ingest
    startCommand: uvicorn app.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENAI_API_KEY
        sync: false        # set manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false        # optional — enables faster Groq inference
      - key: LANGCHAIN_TRACING_V2
        value: "false"
