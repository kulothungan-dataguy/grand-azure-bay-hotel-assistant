services:
  api:
    build: .
    ports:
      # Container runs Uvicorn on 7860 (Hugging Face Spaces convention; see Dockerfile CMD).
      # Mapped to host port 8000 so the API is reachable at http://localhost:8000.
      - "8000:7860"
    env_file: .env
    environment:
      - DATABASE_PATH=/var/data/hotel.db
    volumes:
      - hotel_data:/var/data

  frontend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install streamlit requests --quiet &&
             streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:7860
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - api

volumes:
  hotel_data:
